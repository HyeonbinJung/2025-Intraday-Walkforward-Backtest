name: S-04 2018-2026 sequential six-month swing backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/medium_term_2018_2026_walkforward/backtest.py'
      - 'experiments/medium_term_2018_2026_walkforward/tests/**'
      - 'experiments/medium_term_2018_2026_walkforward/requirements.txt'
      - '.github/workflows/swing-2018-2026-walkforward.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install market-data dependencies
        run: python -m pip install -r experiments/medium_term_2018_2026_walkforward/requirements.txt

      - name: Compile and run regression tests
        run: |
          python -m py_compile experiments/medium_term_2018_2026_walkforward/backtest.py
          python -m unittest discover -s experiments/medium_term_2018_2026_walkforward/tests -v

      - name: Run full historical simulation with public data
        run: |
          python -u experiments/medium_term_2018_2026_walkforward/backtest.py \
            --mode proxy \
            --out experiments/medium_term_2018_2026_walkforward/results/proxy

      - name: Audit completed dates, policy chronology and all cash-out trades
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          home = Path('experiments/medium_term_2018_2026_walkforward/results/proxy')
          s = json.loads((home/'summary.json').read_text())
          assert s['mode'] == 'proxy'
          assert s['date_start'] == '2018-01-02'
          assert s['date_end'] == '2026-06-30'
          assert s['positions_remaining'] == 0
          assert abs(s['terminal_cash_usd'] - s['final_nav']) < .02
          assert len(s['years']) == 9
          assert [z['year'] for z in s['years']] == list(range(2018, 2027))
          assert s['years'][-1]['period_end'] == '2026-06-30'
          policies = s['policy_log']
          assert policies[0]['event'] == 'INITIAL_DEVELOPMENT'
          assert policies[1]['effective_date'].startswith('2019-01')
          assert policies[2]['event'] == '2019H1_FORWARD_REVIEW'
          assert all(a['trained_through'] < a['effective_date'] for a in policies)
          trades = pd.read_csv(home/'trades.csv')
          buys = trades.loc[trades.side == 'BUY', 'date']
          assert buys.empty or buys.max() <= '2025-12-31'
          june = trades.loc[trades.date == '2026-06-30']
          assert len(june) == 0 or set(june.side).issubset({'SELL', 'NON_EXECUTABLE_WRITEOFF'})
          assert (trades.side == 'NON_EXECUTABLE_WRITEOFF').sum() == s['nonexecuted_zero_recovery_writeoffs']
          for f in ('summary.json','trades.csv','equity_curve.csv','yearly.csv','policy_log.json'):
              assert (home/f).stat().st_size > 0
          print('AUDIT PASS: no future-dated selection, no 2026 buys, June terminal cash reconciled.')
          print('SIMULATED ending NAV', s['final_nav'], 'SPY', s['spy_total_return_pct'],
                'Nonexecuted zero-recovery writeoffs', s['nonexecuted_zero_recovery_writeoffs'])
          PY

      - name: Preserve machine-readable replay outputs in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/medium_term_2018_2026_walkforward/results/proxy/
          if ! git diff --cached --quiet; then
            git commit -m "Publish S-04 audited 2018-2026 walk-forward proxy results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload replay evidence as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s04-2018-2026-sequential-proxy
          path: experiments/medium_term_2018_2026_walkforward/results/proxy/
          retention-days: 30
